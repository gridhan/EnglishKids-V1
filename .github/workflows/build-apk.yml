name: Build English Kids APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show repository structure
        run: |
          echo "=== CURRENT DIRECTORY ==="
          pwd

          echo "=== GIT COMMIT ==="
          git rev-parse HEAD

          echo "=== ROOT ==="
          ls -la

          echo "=== APP ==="
          ls -la app

          echo "=== APP/SRC ==="
          ls -la app/src

          echo "=== APP/SRC/MAIN ==="
          ls -la app/src/main

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: English-Kids-APK
          path: app/build/outputs/apk/debug/app-debug.apk
